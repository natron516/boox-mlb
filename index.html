function teamNameForYear(team, year){
  var names = team.names || [];
  for(var i=names.length-1;i>=0;i--){
    if(year >= names[i].from) return names[i].n;
  }
  return names.length ? names[0].n : team.c;
}

function teamsForYear(year){
  return ALL_TEAMS.filter(function(t){ return year >= t.from && year <= t.to; });
}

}

  if(pickB!=null && !has(pickB)) pickB = null;
}

function loadRetroIndex(year, cb){
  retroLoading = true;

    retroAvailable = {};

    games.forEach(function(g){
      retroAvailable[g.home] = true;
      retroAvailable[g.vis] = true;
      if(!retroOpponents[g.home]) retroOpponents[g.home] = {};
      if(!retroOpponents[g.vis]) retroOpponents[g.vis] = {};
      retroOpponents[g.home][g.vis] = true;
      retroOpponents[g.vis][g.home] = true;
    });
    retroLoading = false;
    if(cb) cb();
  }).catch(function(){ retroLoading = false; if(cb) cb(); });
}
function autoSelectPair(){
  var codes = Object.keys(retroAvailable);
  if(!codes.length){ render(); return; }
  var codeToId = {};
  ALL_TEAMS.forEach(function(t){

    rc.forEach(function(c){ codeToId[c] = t.id; });
  });
  var codeA = codes[0];
  var opps = Object.keys(retroOpponents[codeA] || {});
  if(opps.length){
    var codeB = opps[0];
    if(!pickA && codeToId[codeA]) pickA = codeToId[codeA];
    if(!pickB && codeToId[codeB]) pickB = codeToId[codeB];
  }
  render();
}
function teamIsValidOpponent(teamId){
  if(!pickA) return true; // nothing selected yet, show all
  var aCodes = retroCodesForTeam(pickA, pickYear);
  var bCodes = retroCodesForTeam(teamId, pickYear);
  for(var i=0;i<aCodes.length;i++){
    var opps = retroOpponents[aCodes[i]] || {};
    for(var j=0;j<bCodes.length;j++){
      if(opps[bCodes[j]]) return true;
    }
  }
  return false;
}

var ABBR = {"Arizona Diamondbacks":"AZ","Atlanta Braves":"ATL","Baltimore Orioles":"BAL","Boston Red Sox":"BOS","Chicago Cubs":"CHC","Chicago White Sox":"CWS","Cincinnati Reds":"CIN","Cleveland Guardians":"CLE","Colorado Rockies":"COL","Detroit Tigers":"DET","Houston Astros":"HOU","Kansas City Royals":"KC","Los Angeles Angels":"LAA","Los Angeles Dodgers":"LAD","Miami Marlins":"MIA","Milwaukee Brewers":"MIL","Minnesota Twins":"MIN","New York Mets":"NYM","New York Yankees":"NYY","Athletics":"ATH","Oakland Athletics":"OAK","Philadelphia Phillies":"PHI","Pittsburgh Pirates":"PIT","San Diego Padres":"SD","San Francisco Giants":"SF","Seattle Mariners":"SEA","St. Louis Cardinals":"STL","Tampa Bay Rays":"TB","Texas Rangers":"TEX","Toronto Blue Jays":"TOR","Washington Nationals":"WSH"};
function teamAbbr(name){ return ABBR[name] || (name||"").substring(0,3).toUpperCase(); }

function pickGame(games){
  var live = games.filter(function(g){ return g.status && g.status.abstractGameState==="Live"; });
  var fav = games.filter(function(g){
    return teamAbbr(g.teams.away.team.name)===FAV || teamAbbr(g.teams.home.team.name)===FAV
      || (g.teams.away.team.name||"").indexOf("Mariners")>=0 || (g.teams.home.team.name||"").indexOf("Mariners")>=0;
  });
  if(fav.length){
    var favLive = fav.filter(function(g){ return g.status.abstractGameState==="Live"; });
    if(favLive.length) return favLive[0];
    var favToday = fav.filter(function(g){ return g.status.abstractGameState!=="Final"; });
    if(favToday.length) return favToday[0];
    return fav[fav.length-1];
  }
  if(live.length){
    live.sort(function(a,b){
      var da = Math.abs((a.teams.away.score||0)-(a.teams.home.score||0));
      var db = Math.abs((b.teams.away.score||0)-(b.teams.home.score||0));
      var ia = a.linescore ? (a.linescore.currentInning||0) : 0;
      var ib = b.linescore ? (b.linescore.currentInning||0) : 0;
      return (da-db) || (ib-ia);
    });
    return live[0];
  }
  return games.length ? games[0] : null;
}

function lastName(full){
  if(!full) return "";
  var parts = full.trim().split(" ");
  return parts[parts.length-1].toUpperCase();
}
function shortName(full){
  if(!full) return "";
  var parts = full.trim().split(" ");
  if(parts.length===1) return parts[0].toUpperCase();
  return (parts[0][0]+". "+parts[parts.length-1]).toUpperCase();
}

function getPlayer(feed, id){
  try{
    var t = feed.liveData.boxscore.teams;
    return t.away.players["ID"+id] || t.home.players["ID"+id] || null;
  }catch(e){ return null; }
}

function buildLineup(feed, side){
  var out = new Array(9).fill(null);
  try{
    var team = feed.liveData.boxscore.teams[side];
    var players = team.players || {};
    // Get current batter id from multiple sources
    var curBatterId = null;
    try{ curBatterId = feed.liveData.linescore.offense.batter.id; }catch(e){}
    if(!curBatterId){ try{ curBatterId = feed.liveData.plays.currentPlay.matchup.batter.id; }catch(e){} }

    // Group players by slot
    var slotPlayers = {}; // slot -> [{seq, pl, ab}]
    Object.keys(players).forEach(function(k){
      var pl = players[k];
      var bo = parseInt(pl.battingOrder);
      if(!bo || bo <= 0) return;
      var slot = Math.floor(bo / 100) - 1;
      var seq = bo % 100;
      if(slot < 0 || slot >= 9) return;
      var ab = (pl.stats && pl.stats.batting && pl.stats.batting.atBats) || 0;
      if(!slotPlayers[slot]) slotPlayers[slot] = [];
      slotPlayers[slot].push({seq:seq, pl:pl, ab:ab});
    });

    for(var s=0;s<9;s++){
      var group = slotPlayers[s];
      if(!group || !group.length){ out[s]=null; continue; }
      // Sort by seq ascending; default = starter
      group.sort(function(a,b){ return a.seq-b.seq; });
      var chosen = group[0];
      // Find highest-seq player who has batted or is current batter
      for(var g=group.length-1;g>=0;g--){
        var isCur = group[g].pl.person && group[g].pl.person.id === curBatterId;
        if(group[g].ab > 0 || isCur){ chosen = group[g]; break; }
      }
      var pl = chosen.pl;
      var b = (pl.stats && pl.stats.batting) || {};
      var sb = (pl.seasonStats && pl.seasonStats.batting) || {};
      out[s] = {
        id: pl.person && pl.person.id,
        name: shortName(pl.person && pl.person.fullName),
        pos: (pl.position && pl.position.abbreviation) || "",
        avg: sb.avg || ".---",
        h: b.hits!=null?b.hits:0,
        ab: b.atBats!=null?b.atBats:0,
        rbi: b.rbi!=null?b.rbi:0,
        hr: b.homeRuns!=null?b.homeRuns:0
      };
    }
  }catch(e){}
  return out;
}

function pitcherStats(feed, id){
  var pl = getPlayer(feed, id);
  if(!pl) return null;
  var s = (pl.seasonStats && pl.seasonStats.pitching) || {};
  var g = (pl.stats && pl.stats.pitching) || {};
  return {
    name: shortName(pl.person && pl.person.fullName),
    era: s.era || "-.--",
    whip: s.whip || "-.--",
    w: s.wins!=null?s.wins:0,
    l: s.losses!=null?s.losses:0,
    k: g.strikeOuts!=null?g.strikeOuts:(s.strikeOuts||0),
    bb: g.baseOnBalls!=null?g.baseOnBalls:(s.baseOnBalls||0),
    ip: g.inningsPitched || ""
  };
}

function deriveState(feed){
  var ls = feed.liveData.linescore || {};
  var off = ls.offense || {};
  var def = ls.defense || {};
  var cur = feed.liveData.plays && feed.liveData.plays.currentPlay;
  var count = cur && cur.count ? cur.count : {balls:0,strikes:0,outs:ls.outs||0};
  var batSide = "R";
  try{ batSide = cur.matchup.batSide.code || "R"; }catch(e){}
  var st = {
    away: feed.gameData.teams.away.abbreviation || teamAbbr(feed.gameData.teams.away.name),
    home: feed.gameData.teams.home.abbreviation || teamAbbr(feed.gameData.teams.home.name),
    awayScore: (ls.teams&&ls.teams.away&&ls.teams.away.runs)||0,
    homeScore: (ls.teams&&ls.teams.home&&ls.teams.home.runs)||0,
    awayHits: (ls.teams&&ls.teams.away&&ls.teams.away.hits)||0,
    homeHits: (ls.teams&&ls.teams.home&&ls.teams.home.hits)||0,
    awayErr: (ls.teams&&ls.teams.away&&ls.teams.away.errors)||0,
    homeErr: (ls.teams&&ls.teams.home&&ls.teams.home.errors)||0,
    inning: ls.currentInning||0,
    isTop: !!ls.isTopInning,
    innings: ls.innings || [],
    b: count.balls||0, s: count.strikes||0, o: count.outs||0,
    bases: { 1: off.first?off.first.fullName:null, 2: off.second?off.second.fullName:null, 3: off.third?off.third.fullName:null },
    batter: off.batter?off.batter.fullName:null,
    batterId: off.batter?off.batter.id:null,
    pitcher: def.pitcher?def.pitcher.fullName:null,
    pitcherId: def.pitcher?def.pitcher.id:null,
    batSide: batSide,
    state: feed.gameData.status.abstractGameState,
    detailed: feed.gameData.status.detailedState,
    awayLineup: buildLineup(feed,"away"),
    homeLineup: buildLineup(feed,"home")
  };
  // current pitchers per side: defense pitcher belongs to fielding team.
  // isTop => home team fields => def.pitcher is HOME pitcher.
  var defP = st.pitcherId ? pitcherStats(feed, st.pitcherId) : null;
  // Find the other team's most recent pitcher from boxscore decisions is complex; show defense pitcher
  // for the fielding side and season starter stats unknown for the other, so mirror from feed.
  st.homePitcher = st.isTop ? defP : null;
  st.awayPitcher = st.isTop ? null : defP;
  // fallback: probable/last pitcher via boxscore pitchers not in filtered fields; leave null-safe
  st.recent = [];
  var all = feed.liveData.plays && feed.liveData.plays.allPlays;
  if(all){
    var done = all.filter(function(p){ return p.about && p.about.isComplete && p.result && p.result.description; });
    st.recent = done.slice(-8).reverse().map(function(p){
      return { desc: p.result.description, aw: p.result.awayScore, hm: p.result.homeScore, inn: p.about.inning, top: p.about.halfInning==="top" };
    });
  }
  // pitch-by-pitch of current play + zone location of last pitch
  st.pitches = [];
  st.lastPitch = null;
  if(cur && cur.playEvents){
    for(var i=0;i<cur.playEvents.length;i++){
      var ev = cur.playEvents[i];
      if(ev.isPitch){
        var d = ev.details || {};
        st.pitches.push({
          call: (d.call && d.call.description) || d.description || "",
          type: (d.type && d.type.description) || ""
        });
        if(ev.pitchData && ev.pitchData.coordinates && ev.pitchData.coordinates.pX!=null){
          st.lastPitch = {
            px: ev.pitchData.coordinates.pX,
            pz: ev.pitchData.coordinates.pZ,
            szTop: ev.pitchData.strikeZoneTop || 3.5,
            szBot: ev.pitchData.strikeZoneBottom || 1.5
          };
        }
      }
    }
  }
  return st;
}

// ================= DRAW HELPERS =================
function line(x1,y1,x2,y2,w){
  ctx.lineWidth = w||3;
  ctx.strokeStyle = "#000";
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function rect(x,y,w,h,lw){
  ctx.lineWidth = lw||3; ctx.strokeStyle="#000";
  ctx.strokeRect(x,y,w,h);
}
function fillRect(x,y,w,h){ ctx.fillStyle="#000"; ctx.fillRect(x,y,w,h); }
function text(str,x,y,px,bold,align,color){
  font(px,bold);
  ctx.fillStyle = color||"#000";
  ctx.textAlign = align||"left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(str,x,y);
}
function invBand(x,y,w,h,str,px){
  fillRect(x,y,w,h);
  text(str, x+w/2, y+h/2+px*0.36, px, true, "center", "#fff");
}
function diamondBase(cx,cy,size,filled){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(Math.PI/4);
  var s = size/Math.SQRT2;
  ctx.lineWidth = 4; ctx.strokeStyle="#000";
  if(filled){ ctx.fillStyle="#000"; ctx.fillRect(-s/2,-s/2,s,s); }
  else { ctx.fillStyle="#fff"; ctx.fillRect(-s/2,-s/2,s,s); ctx.strokeRect(-s/2,-s/2,s,s); }
  ctx.restore();
}
// stick figure: total height h, anchored so feet at (x,y)
function stickFigure(x,y,h,lw){
  var headR = h*0.14;
  var top = y - h;
  ctx.lineWidth = lw || Math.max(3, h*0.05);
  ctx.strokeStyle = "#000";
  // head
  ctx.beginPath(); ctx.arc(x, top+headR, headR, 0, Math.PI*2); ctx.stroke();
  var neck = top + headR*2;
  var hip = y - h*0.35;
  // body
  ctx.beginPath(); ctx.moveTo(x,neck); ctx.lineTo(x,hip); ctx.stroke();
  // arms
  var arm = h*0.28, ay = neck + h*0.08;
  ctx.beginPath(); ctx.moveTo(x,ay); ctx.lineTo(x-arm*0.7, ay+arm*0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,ay); ctx.lineTo(x+arm*0.7, ay+arm*0.6); ctx.stroke();
  // legs
  ctx.beginPath(); ctx.moveTo(x,hip); ctx.lineTo(x-h*0.18, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,hip); ctx.lineTo(x+h*0.18, y); ctx.stroke();
}
// batter with bat, side: "L" batter stands right of plate (facing left) etc.
function batterFigure(x,y,h,side){
  stickFigure(x,y,h);
  // bat: angled line from shoulder up
  var neck = y - h + h*0.28;
  ctx.lineWidth = Math.max(4, h*0.06);
  ctx.beginPath();
  if(side==="L"){ ctx.moveTo(x+h*0.1, neck); ctx.lineTo(x+h*0.45, neck-h*0.4); }
  else { ctx.moveTo(x-h*0.1, neck); ctx.lineTo(x-h*0.45, neck-h*0.4); }
  ctx.stroke();
}

function drawTeamName(name, cx, cy, maxW, color){
  var words = name.split(" ");
  var line1, line2;
  if(words.length <= 1){
    line1 = name; line2 = "";
  } else {
    var mid = Math.ceil(words.length / 2);
    line1 = words.slice(0, mid).join(" ");
    line2 = words.slice(mid).join(" ");
  }
  // Pick font size so the longest line fits within maxW
  // Canvas 2d measureText uses current font; approximate: each char ~0.6x fontSize
  var longest = line2 && line2.length > line1.length ? line2 : line1;
  var fs = Math.floor(maxW / (longest.length * 0.6));
  if(fs > 34) fs = 34;
  if(fs < 18) fs = 18;
  var lineH = fs + 6;
  var topY = line2 ? cy - lineH/2 : cy + fs/2;
  text(line1, cx, topY, fs, true, "center", color);
  if(line2) text(line2, cx, topY + lineH, fs, true, "center", color);
}

  // season selector: DECADE stacked above YEAR, both centered

// ---- pitch ball animation ----
var ballAnim = null; // {t: 0..1}
var ballAnimating = false;
function pitchCurve(type){
  var t=(type||"").toUpperCase();
  if(t==="FF"||t==="SI"||t==="FC") return {cx:0,   cy:-70};  // fastball: slight rise
  if(t==="SL"||t==="ST")           return {cx:100,  cy:30};   // slider: lateral break
  if(t==="CU"||t==="KC")           return {cx:0,    cy:170};  // curveball: big drop
  if(t==="CH"||t==="FS")           return {cx:55,   cy:130};  // changeup: drop+fade
  if(t==="SW")                     return {cx:140,  cy:20};   // sweeper: big horizontal
  return {cx:0, cy:0};
}
var ballAnimPitchType="";
function animateBall(pitchType){
  if(ballAnimating) return;
  ballAnimating=true;
  ballAnimPitchType=pitchType||"";
  var frames=10, f=0;
  function step(){
    f++; ballAnim={t:f/frames}; render();
    if(f<frames){ setTimeout(step,55); }
    else{ ballAnim=null; ballAnimating=false; render(); }
  }
  setTimeout(step,55);
}

// Batted ball arc: flies from home plate toward Statcast hit coordinates
var hitAnim=null, hitAnimTarget={x:0,y:0};
function animateHitTo(tx, ty){
  hitAnimTarget = {x:tx, y:ty};
  var frames=20, f=0;
  function step(){
    f++; hitAnim={t:f/frames}; render();
    if(f<frames){ setTimeout(step,70); }
    else{ hitAnim=null; render(); }
  }
  setTimeout(step,70);
}
// Pick a target: outs land at a fielder position, hits land between fielders
function fallbackHitTarget(eventType, isHit){
  var e = (eventType||"").toLowerCase();
  var r = Math.random();
  var side = (Math.random()<0.5?-1:1);
  if(!isHit && IF_POS && OF_POS){
    // Out: land right at a fielder
    var isFly = (e.indexOf("flyout")>=0 || e.indexOf("fly out")>=0 || e.indexOf("pop")>=0 || e.indexOf("sac fly")>=0);
    var group = isFly ? OF_POS : IF_POS;
    var f = group[Math.floor(Math.random()*group.length)];
    return { x: f.x, y: f.y };
  }
  if(isHit && IF_POS && OF_POS){
    // Hit: land in the gaps between fielders
    var LF = OF_POS[0], CF = OF_POS[1], RF = OF_POS[2];
    if(e==="single"){
      // shallow outfield, between IF and OF depth
      var sx = D_HOME.x + side*(60+r*260);
      var sy = (D_2B.y + ((IF_POS[1].y + CF.y)/2)) / 2 + 40 - r*80;
      return { x: sx, y: sy };
    }
    if(e==="double"){
      // deep gap: between LF-CF or CF-RF
      var gapX = side<0 ? (LF.x+CF.x)/2 : (CF.x+RF.x)/2;
      return { x: gapX + (r-0.5)*80, y: CF.y + 10 - r*40 };
    }
    if(e==="triple"){
      // warning track corner
      var cornerX = side<0 ? LF.x - 120 : RF.x + 120;
      return { x: cornerX, y: LF.y - 40 - r*40 };
    }
    if(e==="home run"){
      // way past the OF line, off screen top
      return { x: CF.x + side*r*300, y: -80 };
    }
    // default hit: shallow-medium center
    return { x: D_HOME.x + side*r*150, y: D_2B.y - 20 - r*60 };
  }
  // No fielder positions yet: rough offsets from home
  var dx = side*(60+r*200), dy = 400+r*120;
  return { x: D_HOME.x + dx, y: D_HOME.y - dy };
}
function animateHit(coordX, coordY, eventType, isHit){
  if(coordX!=null && coordY!=null){
    // Statcast field coords: home plate ~(125, 200), x=right, y=up-field
    // Map to canvas: canvas home=D_HOME, field goes up (decreasing canvas y)
    // Scale: ~3.2px per foot
    var scale = 3.2;
    var fieldOriginX = 125.42, fieldOriginY = 198.27; // Statcast home plate
    var dx = (coordX - fieldOriginX) * scale;
    var dy = (coordY - fieldOriginY) * scale; // positive = into field = canvas up
    animateHitTo(D_HOME.x + dx, D_HOME.y - dy);
    return;
  }
  var tgt = fallbackHitTarget(eventType, isHit);
  animateHitTo(tgt.x, tgt.y);
}

// ---- runner animation ----
var runnerAnim = null;
// {fromX, fromY, toX, toY, t, frames, onDone}
function animateRunner(fromX, fromY, toX, toY, onDone, frames, delayMs){
  if(runnerAnim){
    // queue: retry after a short delay so chained runner moves aren't dropped
    setTimeout(function(){ animateRunner(fromX,fromY,toX,toY,onDone,frames,delayMs); }, 80);
    return;
  }
  var fr = frames || 16;
  var dm = delayMs || 60;
  runnerAnim = {fromX:fromX, fromY:fromY, toX:toX, toY:toY, t:0, frames:fr, onDone:onDone};
  function step(){
    if(!runnerAnim) return;
    runnerAnim.t++;
    render();
    if(runnerAnim.t < runnerAnim.frames){
      setTimeout(step, dm);
    } else {
      var cb = runnerAnim.onDone;
      runnerAnim = null;
      render();
      if(cb) cb();
    }
  }
  setTimeout(step, dm);
}
// Dugout positions beside home plate (spread wide so they don't hit the AT BAT line)
var DUGOUT_HOME = {x: D_HOME.x + 380, y: D_HOME.y + 80};
var DUGOUT_VIS  = {x: D_HOME.x - 380 - 140, y: D_HOME.y + 80};
// Batter visibility state machine: up | running | dugout | incoming
var batterState = "up";
// Next batter walks in from the dugout to the plate
function animateBatterIncoming(isTop, onDone){
  var d = isTop ? DUGOUT_VIS : DUGOUT_HOME;
  batterState = "incoming";
  animateRunner(d.x + 70, d.y + 25, D_HOME.x, D_HOME.y, function(){
    batterState = "up";
    if(onDone) onDone();
  }, 12, 70);
}
// Batter walks from home plate to the near dugout (out)
function animateBatterOut(isTop, onDone){
  var d = isTop ? DUGOUT_VIS : DUGOUT_HOME;
  batterState = "running";
  animateRunner(D_HOME.x, D_HOME.y, d.x + 70, d.y + 25, function(){
    batterState = "dugout";
    if(onDone) onDone();
  }, 12, 80);
}
// Base coordinates matching where runners stand in drawDiamond
function baseCoord(b){
  if(b===0) return {x: D_HOME.x, y: D_HOME.y};
  if(b===1) return {x: D_1B.x + 72, y: D_1B.y};
  if(b===2) return {x: D_2B.x, y: D_2B.y - 72};
  if(b===3) return {x: D_3B.x - 72, y: D_3B.y};
  // scored: home plate then off-screen below
  return {x: D_HOME.x, y: D_HOME.y + 100};
}
// Run a list of {from, to} base-index steps sequentially, then call done
function runRunnerSteps(steps, done){
  if(!steps || !steps.length){ if(done) done(); return; }
  var s = steps.shift();
  var a = baseCoord(s.from), b = baseCoord(s.to);
  animateRunner(a.x, a.y, b.x, b.y, function(){ runRunnerSteps(steps, done); });
}
// Batter-reaches-first events
function batterReachesFirst(evName){
  var e = (evName||"").toLowerCase();
  return e==="single" || e==="double" || e==="triple" || e==="home run" ||
         e==="walk" || e==="intent walk" || e==="intentional walk" ||
         e==="hit by pitch" || e==="fielders choice" || e==="fielders choice out";
}
// Build runner steps for advancing from play (prev -> cur matchup postOn*)
function buildRunnerSteps(prevPlay, curPlay){
  var steps = [];
  try{
    var pm = prevPlay ? (prevPlay.matchup||{}) : {};
    var cm = curPlay ? (curPlay.matchup||{}) : {};
    var p1 = pm.postOnFirst ? pm.postOnFirst.id : null;
    var p2 = pm.postOnSecond ? pm.postOnSecond.id : null;
    var p3 = pm.postOnThird ? pm.postOnThird.id : null;
    var c1 = cm.postOnFirst ? cm.postOnFirst.id : null;
    var c2 = cm.postOnSecond ? cm.postOnSecond.id : null;
    var c3 = cm.postOnThird ? cm.postOnThird.id : null;
    // only within the same half-inning
    var sameHalf = prevPlay && curPlay && prevPlay.about && curPlay.about &&
      prevPlay.about.inning===curPlay.about.inning &&
      prevPlay.about.halfInning===curPlay.about.halfInning;
    if(sameHalf){
      // lead runners first: 3B->home, 2B->3B, 1B->2B
      if(p3 && p3!==c3 && p3!==c2 && p3!==c1) steps.push({from:3, to:4});
      if(p2 && p2===c3) steps.push({from:2, to:3});
      if(p1 && p1===c2) steps.push({from:1, to:2});
    }
  }catch(e){}
  return steps;
}

// ---- replay auto-advance ----
var replayTimer = null, replayPaused = false;
function stopReplayTimer(){ if(replayTimer){ clearInterval(replayTimer); replayTimer = null; } }
function startReplayTimer(){
  stopReplayTimer();
  replayTimer = setInterval(function(){
    if(mode!=="replay" || replayPaused || ballAnimating || runnerAnim) return;
    var play = replayPlays[replayIdx];
    if(retroGame && !replayFeed){
      // Retrosheet replay: pitches from pc string, no playEvents
      var rpc = retroPitchCount(play);
      if(replayPitchIdx < rpc){
        animateBall(retroPitchType());
        replayPitchIdx++;
        render();
      } else if(replayIdx < replayPlays.length-1){
        var lastChar = (play.pc||"").charAt((play.pc||"").length-1);
        var retroIsHit = (play.desc==="Single"||play.desc==="Double"||play.desc==="Ground Rule Double"||play.desc==="Triple"||play.desc==="Home Run");
        if(lastChar==="X"){
          var evMap = {"Single":"single","Double":"double","Ground Rule Double":"double","Triple":"triple","Home Run":"home run","Out":"flyout","Error":"groundout","Fielder's Choice":"fielders choice","Force Out":"groundout","Double Play":"groundout"};
          var tgt = fallbackHitTarget(evMap[play.desc]||"", retroIsHit);
          animateHitTo(tgt.x, tgt.y);
        }
        var retroAdvance = function(){
          replayIdx++;
          replayPitchIdx = 0;
          render();
          var np = replayPlays[replayIdx];
          animateBatterIncoming(np ? np.t===0 : true);
        };
        if(retroIsHit || play.desc==="Walk" || play.desc==="Hit By Pitch" || play.desc==="Fielder's Choice"){
          batterState = "running";
          runRunnerSteps([{from:0, to:1}], retroAdvance);
        } else if(play.desc==="Out"||play.desc==="Strikeout"||play.desc==="Force Out"||play.desc==="Double Play"||play.desc==="Error"){
          animateBatterOut(play.t===0, retroAdvance);
        } else {
          retroAdvance();
        }
      } else {
        stopReplayTimer();
        render();
      }
      return;
    }
    var pitchCount = 0;
    if(play && play.playEvents){
      for(var i=0;i<play.playEvents.length;i++) if(play.playEvents[i].isPitch) pitchCount++;
    }
    if(replayPitchIdx < pitchCount){
      // fire animation (non-blocking), advance pitch immediately
      var curType="";
      try{
        var pevts=replayPlays[replayIdx].playEvents,pc2=0;
        for(var pi=0;pi<pevts.length;pi++){
          if(pevts[pi].isPitch){
            if(pc2===replayPitchIdx) curType=(pevts[pi].details&&pevts[pi].details.type&&pevts[pi].details.type.code)||"";
            pc2++;
          }
        }
      }catch(e){}
      animateBall(curType);
      replayPitchIdx++;
      render();
    } else if(replayIdx < replayPlays.length-1){
      // all pitches shown -> fire hit arc if in play, then runner animations, then advance
      var lastPlay = replayPlays[replayIdx];
      var evName = (lastPlay && lastPlay.result && lastPlay.result.event) || "";
      var evLow = evName.toLowerCase();
      var isHitEv = (evLow==="single"||evLow==="double"||evLow==="triple"||evLow==="home run"||evLow==="ground rule double");
      try{
        if(lastPlay && lastPlay.playEvents){
          var pevts2 = lastPlay.playEvents;
          for(var pi2=pevts2.length-1;pi2>=0;pi2--){
            if(pevts2[pi2].isPitch){
              var callCode = (pevts2[pi2].details&&pevts2[pi2].details.call&&pevts2[pi2].details.call.code)||"";
              if(callCode==="X"){
                var hd = pevts2[pi2].hitData;
                if(hd && hd.coordinates && hd.coordinates.coordX!=null){
                  animateHit(hd.coordinates.coordX, hd.coordinates.coordY, evName, isHitEv);
                } else {
                  animateHit(null, null, evName, isHitEv);
                }
              }
              break;
            }
          }
        }
      }catch(e){}
      // runner animation chain: lead runners advance, then batter to 1B (or dugout on out)
      var steps = buildRunnerSteps(replayIdx>0 ? replayPlays[replayIdx-1] : null, lastPlay);
      if(batterReachesFirst(evName)) steps.push({from:0, to:1});
      var isOutEv = !batterReachesFirst(evName) && /strikeout|groundout|flyout|lineout|pop out|popout|forceout|force out|double play|grounded into dp|sac fly|sac bunt|field out/.test(evLow);
      var advance = function(){
        replayIdx++;
        replayPitchIdx = 0;
        render();
        var np2 = replayPlays[replayIdx];
        var npTop = !!(np2 && np2.about && np2.about.halfInning==="top");
        animateBatterIncoming(npTop);
      };
      var finish = isOutEv ? function(){
        var top2 = !!(lastPlay && lastPlay.about && lastPlay.about.halfInning==="top");
        animateBatterOut(top2, advance);
      } : advance;
      if(batterReachesFirst(evName)) batterState = "running";
      if(steps.length){
        runRunnerSteps(steps, finish);
      } else if(isOutEv){
        finish();
      } else {
        advance();
      }
    } else {
      stopReplayTimer();
      render();
    }
  }, 2200);
}
function toggleReplayPause(){
  replayPaused = !replayPaused;
  if(!replayPaused && !replayTimer && replayIdx < replayPlays.length-1) startReplayTimer();
  render();
}

// ================= RETROSHEET (pre-1974) =================
function retroPitchCount(play){
  return (play.pc||"").replace(/[^BCSXFTIbcsxfti]/g,"").length;
}
var RETRO_POS = {1:"P",2:"C",3:"1B",4:"2B",5:"3B",6:"SS",7:"LF",8:"CF",9:"RF",10:"DH"};
function retroPitchType(){
  var r = Math.random();
  if(pickYear >= 1950){ return r < 0.6 ? "FF" : (r < 0.8 ? "CU" : "CH"); }
  return r < 0.7 ? "FF" : "CU";
}
function findRetroGame(){
  mode = "searching"; render();
  var codesA = retroCodesForTeam(pickA, pickYear);
  var codesB = retroCodesForTeam(pickB, pickYear);
  if(!codesA.length || !codesB.length){ mode="picker"; searchMsg="TEAM NOT IN RETROSHEET"; render(); return; }
  fetch(RS_BASE + "idx.json").then(function(r){ return r.json(); }).then(function(idx){
    var games = (idx[String(pickYear)]||[]).filter(function(g){
      var aMatch = codesA.indexOf(g.home)>=0 || codesA.indexOf(g.vis)>=0;
      var bMatch = codesB.indexOf(g.home)>=0 || codesB.indexOf(g.vis)>=0;
      return aMatch && bMatch;
    });
    if(!games.length){ mode="picker"; searchMsg="NO GAME FOUND FOR THIS MATCHUP"; render(); return; }
    var pick = games[Math.floor(Math.random()*games.length)];
    fetch(RS_BASE + pickYear + ".json").then(function(r){ return r.json(); }).then(function(yr){
      var g = yr.filter(function(x){ return x.id===pick.id; })[0];
      if(!g){ mode="picker"; searchMsg="GAME DATA MISSING"; render(); return; }
      retroGame = g;
      replayPlays = g.plays; replayIdx = 0; replayPitchIdx = 0;
      replayFeed = null;
      replayLabel = "REPLAY \u00b7 " + g.vis + " @ " + g.home + " \u00b7 " + g.date;
      mode = "replay"; replayPaused = false; startReplayTimer(); render();
    }).catch(function(){ mode="picker"; searchMsg="RETROSHEET FETCH FAILED"; render(); });
  }).catch(function(){ mode="picker"; searchMsg="RETROSHEET FETCH FAILED"; render(); });
}

// ================= FIND GAME =================
function findGame(){
  if(pickYear < 1974){ findRetroGame(); return; }
  mode = "searching";
  render();
  var url = "https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId="+pickA+"&season="+pickYear+"&gameType=R&fields=dates,date,games,gamePk,teams,away,home,team,id,status,codedGameState";
  fetch(url).then(function(r){ return r.json(); }).then(function(sched){
    var matches = [];
    (sched.dates||[]).forEach(function(d){
      (d.games||[]).forEach(function(g){
        try{
          var a = g.teams.away.team.id, h = g.teams.home.team.id;
          var both = (a===pickA && h===pickB) || (a===pickB && h===pickA) ||
                     (pickA===pickB && (a===pickA || h===pickA));
          if(both && g.status && g.status.codedGameState==="F"){
            g._date = d.date;
            matches.push(g);
          }
        }catch(e){}
      });
    });
    if(!matches.length){
      mode = "picker";
      searchMsg = "NO GAMES FOUND - TRY ANOTHER YEAR";
      render();
      return;
    }
    var g = matches[Math.floor(Math.random()*matches.length)];
    return fetch(feedUrl(g.gamePk)).then(function(r){ return r.json(); }).then(function(feed){
      startReplay(feed, g._date);
    });
  }).catch(function(e){
    mode = "picker";
    searchMsg = "FETCH ERROR - TRY AGAIN";
    render();
  });
}

function startReplay(feed, dateStr){
  var all = (feed.liveData && feed.liveData.plays && feed.liveData.plays.allPlays) || [];
  var plays = all.filter(function(p){ return p.about && p.about.isComplete; });
  if(!plays.length){
    mode = "picker";
    searchMsg = "NO PLAY DATA FOR THAT GAME";
    render();
    return;
  }
  replayFeed = feed;
  replayPlays = plays;
  replayIdx = 0;
  replayPitchIdx = 0;
  var aw = feed.gameData.teams.away.abbreviation || teamAbbr(feed.gameData.teams.away.name);
  var hm = feed.gameData.teams.home.abbreviation || teamAbbr(feed.gameData.teams.home.name);
  replayLabel = "REPLAY \u00b7 "+aw+" @ "+hm+" \u00b7 "+(dateStr||"");
  mode = "replay";
  replayPaused = false;
  startReplayTimer();
  render();
}

// ================= REPLAY STATE BUILDER =================
function retroLineup(arr){
  var out = new Array(9).fill(null);
  (arr||[]).forEach(function(p){
    if(p.slot >= 1 && p.slot <= 9){
      out[p.slot-1] = {
        id: p.id,
        name: shortName(p.name),
        pos: RETRO_POS[p.pos] || String(p.pos),
        avg: ".---", h: 0, ab: 0, rbi: 0, hr: 0
      };
    }
  });
  return out;
}
var RETRO_CALLS = {B:"Ball",C:"Called Strike",S:"Swinging Strike",F:"Foul",X:"In Play",T:"Foul Tip",I:"Ball (Int)"};
function deriveRetroReplayState(){
  var g = retroGame;
  var play = replayPlays[replayIdx];
  // running score + innings from plays 0..replayIdx
  var innings = [];
  var vScore = 0, hScore = 0;
  for(var i=0;i<=replayIdx;i++){
    var p = replayPlays[i];
    while(innings.length < p.i) innings.push({away:{runs:0},home:{runs:0}});
    var r = p.r || 0;
    if(r){
      if(p.t===0){ vScore += r; innings[p.i-1].away.runs += r; }
      else { hScore += r; innings[p.i-1].home.runs += r; }
    }
  }
  // count from shown pitch chars
  var pcStr = (play.pc||"");
  var shown = pcStr.slice(0, Math.max(0, replayPitchIdx));
  var balls = 0, strikes = 0;
  var pitches = [];
  for(var k=0;k<shown.length;k++){
    var c = shown[k];
    pitches.push({ call: RETRO_CALLS[c]||"Pitch", type: "" });
    if(c==="B"||c==="I") balls++;
    else if(c==="C"||c==="S"){ if(strikes<3) strikes++; }
    else if(c==="F"||c==="T"){ if(strikes<2) strikes++; }
  }
  if(balls>3) balls=3;
  var st = {
    away: g.vis, home: g.home,
    awayScore: vScore, homeScore: hScore,
    awayHits: 0, homeHits: 0, awayErr: 0, homeErr: 0,
    inning: play.i,
    isTop: play.t===0,
    innings: innings,
    b: balls, s: strikes, o: 0,
    bases: {1:null,2:null,3:null},
    batter: play.bat,
    batterId: null,
    pitcher: play.pit,
    pitcherId: null,
    batSide: "R",
    state: "Live",
    detailed: "RETROSHEET",
    awayLineup: retroLineup(g.vp),
    homeLineup: retroLineup(g.hp),
    homePitcher: null,
    awayPitcher: null
  };
  // recent: last 5 completed plays before replayIdx (plus none of current)
  var vs2 = 0, hs2 = 0;
  var recent = [];
  for(var j=0;j<replayIdx;j++){
    var pp = replayPlays[j];
    var rr = pp.r || 0;
    if(pp.t===0) vs2 += rr; else hs2 += rr;
    recent.push({ desc: pp.bat + ": " + pp.desc, aw: vs2, hm: hs2, inn: pp.i, top: pp.t===0 });
  }
  st.recent = recent.slice(-5).reverse();
  st.pitches = pitches;
  // Retrosheet has no pitch coordinates; show a placeholder center dot once a pitch is thrown
  st.lastPitch = pitches.length > 0 ? {px:0, pz:2.5, szTop:3.5, szBot:1.5} : null;
  return st;
}
function deriveReplayState(){
  if(retroGame && !replayFeed) return deriveRetroReplayState();
  var feed = replayFeed;
  var play = replayPlays[replayIdx];
  var aw = feed.gameData.teams.away.abbreviation || teamAbbr(feed.gameData.teams.away.name);
  var hm = feed.gameData.teams.home.abbreviation || teamAbbr(feed.gameData.teams.home.name);

  // build innings + running score from plays 0..idx
  var innings = [];
  var prevA = 0, prevH = 0;
  for(var i=0;i<=replayIdx;i++){
    var p = replayPlays[i];
    var ra = (p.result && p.result.awayScore!=null) ? p.result.awayScore : prevA;
    var rh = (p.result && p.result.homeScore!=null) ? p.result.homeScore : prevH;
    var inn = (p.about && p.about.inning) || 1;
    while(innings.length < inn) innings.push({away:{runs:0},home:{runs:0}});
    var da = ra - prevA, dh = rh - prevH;
    if(da>0) innings[inn-1].away.runs += da;
    if(dh>0) innings[inn-1].home.runs += dh;
    prevA = ra; prevH = rh;
  }

  // pitch events of current play, limited by replayPitchIdx (pitch-by-pitch stepping)
  var allPitches = [];
  if(play.playEvents){
    for(var pe=0;pe<play.playEvents.length;pe++) if(play.playEvents[pe].isPitch) allPitches.push(play.playEvents[pe]);
  }
  var shownPitches = allPitches.slice(0, Math.max(0, replayPitchIdx));
  var lastShown = shownPitches.length ? shownPitches[shownPitches.length-1] : null;
  // count: from last shown pitch's count; intro = 0-0 with outs carried from previous play in same half
  var count;
  if(replayPitchIdx >= allPitches.length){
    count = play.count || {balls:0,strikes:0,outs:0};
  } else if(lastShown && lastShown.count){
    count = lastShown.count;
  } else {
    var baseOuts = 0;
    if(replayIdx > 0){
      var pv = replayPlays[replayIdx-1];
      if(pv.about && play.about && pv.about.inning===play.about.inning && pv.about.halfInning===play.about.halfInning && pv.count){
        baseOuts = pv.count.outs || 0;
      }
    }
    count = {balls:0,strikes:0,outs:baseOuts};
  }
  var mu = play.matchup || {};
  var batSide = "R";
  try{ batSide = mu.batSide.code || "R"; }catch(e){}

  var st = {
    away: aw, home: hm,
    awayScore: prevA, homeScore: prevH,
    awayHits: 0, homeHits: 0, awayErr: 0, homeErr: 0,
    inning: (play.about && play.about.inning) || 1,
    isTop: !!(play.about && play.about.halfInning==="top"),
    innings: innings,
    b: count.balls||0, s: count.strikes||0, o: count.outs||0,
    bases: {
      1: mu.postOnFirst ? mu.postOnFirst.fullName : null,
      2: mu.postOnSecond ? mu.postOnSecond.fullName : null,
      3: mu.postOnThird ? mu.postOnThird.fullName : null
    },
    batter: mu.batter ? mu.batter.fullName : null,
    batterId: mu.batter ? mu.batter.id : null,
    pitcher: mu.pitcher ? mu.pitcher.fullName : null,
    pitcherId: mu.pitcher ? mu.pitcher.id : null,
    batSide: batSide,
    state: "Live",
    detailed: "REPLAY",
    awayLineup: buildLineup(feed,"away"),
    homeLineup: buildLineup(feed,"home")
  };
  var defP = st.pitcherId ? pitcherStats(feed, st.pitcherId) : null;
  st.homePitcher = st.isTop ? defP : null;
  st.awayPitcher = st.isTop ? null : defP;

  // recent plays: completed plays up to and including current
  // Only show plays that have COMPLETED before the current one — not the play being pitched now
  var done = replayPlays.slice(0, replayIdx).filter(function(p){ return p.result && p.result.description; });
  st.recent = done.slice(-8).reverse().map(function(p){
    return { desc: p.result.description, aw: p.result.awayScore, hm: p.result.homeScore, inn: p.about.inning, top: p.about.halfInning==="top" };
  });

  // pitches of current play — only those shown so far (pitch-by-pitch)
  st.pitches = [];
  st.lastPitch = null;
  for(var k=0;k<shownPitches.length;k++){
    var ev = shownPitches[k];
    var d = ev.details || {};
    st.pitches.push({
      call: (d.call && d.call.description) || d.description || "",
      type: (d.type && d.type.description) || ""
    });
    if(ev.pitchData && ev.pitchData.coordinates && ev.pitchData.coordinates.pX!=null){
      st.lastPitch = {
        px: ev.pitchData.coordinates.pX,
        pz: ev.pitchData.coordinates.pZ,
        szTop: ev.pitchData.strikeZoneTop || 3.5,
        szBot: ev.pitchData.strikeZoneBottom || 1.5
      };
    }
  }
  return st;
}

// ================= TAP HANDLING =================
function handleTap(clientX, clientY){
  var r = canvas.getBoundingClientRect();
  var x = (clientX - r.left) * (CW / r.width);
  var y = (clientY - r.top) * (CH / r.height);
  for(var i=hitRegions.length-1;i>=0;i--){
    var h = hitRegions[i];
    if(x>=h.x && x<=h.x+h.w && y>=h.y && y<=h.y+h.h){ h.fn(); return; }
  }
}
var touched = false;

canvas.addEventListener("touchend", function(e){
  touched = true;
  if(e.changedTouches && e.changedTouches.length){
    e.preventDefault();
    handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
}, {passive:false});
canvas.addEventListener("click", function(e){
  if(touched){ touched = false; return; }
  handleTap(e.clientX, e.clientY);
});

// ---- linescore grid ----
function drawLinescoreGrid(st, y){
  var cols = 9;
  var n = Math.max(9, st.innings.length);
  if(n>9) cols = n;
  var cellW = 64, labW = 110, rheW = 64;
  var gridW = labW + cols*cellW + 3*rheW;
  var x0 = CENTER_X - gridW/2;
  var rowH = 46;

  // header row: INN numbers
  font(30,true); ctx.textAlign="center"; ctx.fillStyle="#000";
  // INN row (bottom label per spec: AWAY, HOME, INN — draw header on top instead for readability)
  var rows = [
    { lab:"INN", vals:null },
    { lab: st.away, side:"away" },
    { lab: st.home, side:"home" }
  ];
  for(var r=0;r<3;r++){
    var y0 = y + r*rowH;
    text(rows[r].lab, x0+labW/2, y0+rowH-13, 30, true, "center");
    for(var c=0;c<cols;c++){
      var cx = x0+labW+c*cellW+cellW/2;
      var v;
      if(r===0){ v = String(c+1); }
      else {
        var inn = st.innings[c];
        v = inn && inn[rows[r].side] && inn[rows[r].side].runs!=null ? String(inn[rows[r].side].runs) : "-";
      }
      text(v, cx, y0+rowH-13, 30, r===0, "center");
    }
    // R H E
    var rheVals;
    if(r===0) rheVals=["R","H","E"];
    else if(r===1) rheVals=[st.awayScore, st.awayHits, st.awayErr];
    else rheVals=[st.homeScore, st.homeHits, st.homeErr];
    for(var k=0;k<3;k++){
      text(String(rheVals[k]), x0+labW+cols*cellW+k*rheW+rheW/2, y0+rowH-13, 30, true, "center");
    }
  }
  // grid lines
  ctx.lineWidth=2;
  rect(x0, y, gridW, rowH*3, 3);
  line(x0, y+rowH, x0+gridW, y+rowH, 2);
  line(x0, y+rowH*2, x0+gridW, y+rowH*2, 2);
  line(x0+labW, y, x0+labW, y+rowH*3, 2);
  line(x0+labW+cols*cellW, y, x0+labW+cols*cellW, y+rowH*3, 3);

  // inning state to right of grid
  var innTxt = st.state==="Final" ? "FINAL" : (st.inning>0 ? (st.isTop?"TOP ":"BOT ")+st.inning : "PRE");
  text(innTxt, x0+gridW+40, y+58, 40, true, "left");
  text("B"+st.b+" S"+st.s+" O"+st.o, x0+gridW+40, y+112, 34, true, "left");
}

// ---- lineup panel ----
function drawLineupPanel(x, y, abbr, lineup, activeBatterId){
  var w = PANEL_W;
  var hdrH = 64;
  var rowH = 90;
  var h = hdrH + 44 + 9*rowH + 14;
  rect(x, y, w, h, 3);
  invBand(x, y, w, hdrH, abbr + " LINEUP", 40);
  text("#", x+18, y+hdrH+34, 32, true);
  text("BATTER", x+74, y+hdrH+34, 32, true);
  text("AVG", x+w-220, y+hdrH+34, 32, true);
  text("TODAY", x+w-110, y+hdrH+34, 32, true);
  var ry = y+hdrH+48;
  for(var i=0;i<9;i++){
    var b = lineup[i];
    var top = ry + i*rowH;
    var active = b && activeBatterId && b.id===activeBatterId;
    if(active){ ctx.fillStyle="#000"; ctx.fillRect(x+4, top, w-8, rowH-4); }
    var col = active ? "#fff" : "#000";
    if(b){
      text(String(i+1), x+18, top+44, 42, true, "left", col);
      text(b.name.substring(0,14), x+74, top+44, 42, true, "left", col);
      text(b.avg, x+w-220, top+44, 32, false, "left", col);
      text(b.pos, x+w-100, top+44, 32, false, "left", col);
      text(b.h+"/"+b.ab+"  "+b.rbi+" RBI  "+b.hr+" HR", x+74, top+82, 30, false, "left", col);
    } else {
      text(String(i+1), x+18, top+44, 42, true, "left", col);
      text("---", x+74, top+44, 42, false, "left", col);
    }
  }
}

// ---- pitcher box ----
function drawPitcherBox(x, y, label, p){
  var w = PANEL_W, h = 200;
  rect(x, y, w, h, 3);
  invBand(x, y, w, 50, label, 32);
  if(p){
    text(p.name, x+20, y+112, 52, true);
    text("ERA "+p.era+"  WHIP "+p.whip, x+20, y+154, 32);
    text("W-L "+p.w+"-"+p.l+"  K "+p.k+"  BB "+p.bb+(p.ip?("  IP "+p.ip):""), x+20, y+190, 32);
  } else {
    text("---", x+20, y+112, 52, true);
  }
}

// ---- diamond ----
function drawDiamond(st){
  // base paths
  line(D_HOME.x, D_HOME.y, D_1B.x, D_1B.y, 5);
  line(D_1B.x, D_1B.y, D_2B.x, D_2B.y, 5);
  line(D_2B.x, D_2B.y, D_3B.x, D_3B.y, 5);
  line(D_3B.x, D_3B.y, D_HOME.x, D_HOME.y, 5);

  // bases
  diamondBase(D_1B.x, D_1B.y, 54, !!st.bases[1]);
  diamondBase(D_2B.x, D_2B.y, 54, !!st.bases[2]);
  diamondBase(D_3B.x, D_3B.y, 54, !!st.bases[3]);
  diamondBase(D_HOME.x, D_HOME.y, 54, false);

  // pitcher's mound
  ctx.fillStyle="#000";
  ctx.beginPath(); ctx.arc(MOUND.x, MOUND.y, 22, 0, Math.PI*2); ctx.fill();

  // pitched ball — bezier curve shaped by pitch type
  if(ballAnim){
    var bt=ballAnim.t, c=pitchCurve(ballAnimPitchType);
    var mx=(MOUND.x+D_HOME.x)/2+c.cx, my=(MOUND.y+D_HOME.y)/2+c.cy;
    var ballX=(1-bt)*(1-bt)*MOUND.x+2*(1-bt)*bt*mx+bt*bt*D_HOME.x;
    var ballY=(1-bt)*(1-bt)*MOUND.y+2*(1-bt)*bt*my+bt*bt*D_HOME.y;
    ctx.fillStyle="#000";
    ctx.beginPath(); ctx.arc(ballX,ballY,14,0,Math.PI*2); ctx.fill();
  }
  // batted ball arc — flies from home plate to hit location
  if(hitAnim){
    var ht=hitAnim.t;
    // arc peak halfway along the path
    var peakX=(D_HOME.x+hitAnimTarget.x)/2;
    var peakY=Math.min(D_HOME.y,hitAnimTarget.y)-300*(1-(ht*2-1)*(ht*2-1));
    var hbx=(1-ht)*(1-ht)*D_HOME.x+2*(1-ht)*ht*peakX+ht*ht*hitAnimTarget.x;
    var hby=(1-ht)*(1-ht)*D_HOME.y+2*(1-ht)*ht*peakY+ht*ht*hitAnimTarget.y;
    ctx.fillStyle="#000";
    ctx.beginPath(); ctx.arc(hbx,hby,14,0,Math.PI*2); ctx.fill();
  }

  // fielders (infield)
  var IF = [
    {x: D_1B.x+70,  y: D_1B.y-70},   // 1B
    {x: CENTER_X+170, y: D_2B.y+90}, // 2B
    {x: CENTER_X-170, y: D_2B.y+90}, // SS
    {x: D_3B.x-70,  y: D_3B.y-70}    // 3B
  ];
  IF_POS = IF;
  IF.forEach(function(f){ stickFigure(f.x, f.y, 60, 4); });
  // outfielders — between box score and 2B
  var OF = [
    {x: CENTER_X-420, y: D_2B.y-40},  // LF
    {x: CENTER_X,     y: D_2B.y-90},  // CF
    {x: CENTER_X+420, y: D_2B.y-40}   // RF
  ];
  OF_POS = OF;
  OF.forEach(function(f){ stickFigure(f.x, f.y, 50, 3); });

  // runners on base + name labels
  if(st.bases[1]){
    stickFigure(D_1B.x, D_1B.y, 80);
    text(lastName(st.bases[1]), D_1B.x, D_1B.y-80-14, 26, true, "center");
  }
  if(st.bases[2]){
    stickFigure(D_2B.x, D_2B.y, 80);
    text(lastName(st.bases[2]), D_2B.x, D_2B.y-80-14, 26, true, "center");
  }
  if(st.bases[3]){
    stickFigure(D_3B.x, D_3B.y, 80);
    text(lastName(st.bases[3]), D_3B.x, D_3B.y-80-14, 26, true, "center");
  }

  // dugouts beside home plate
  rect(DUGOUT_HOME.x, DUGOUT_HOME.y, 140, 50, 3);
  text("DUGOUT", DUGOUT_HOME.x + 70, DUGOUT_HOME.y + 33, 22, true, "center");
  rect(DUGOUT_VIS.x, DUGOUT_VIS.y, 140, 50, 3);
  text("DUGOUT", DUGOUT_VIS.x + 70, DUGOUT_VIS.y + 33, 22, true, "center");

  // animated runner in motion
  if(runnerAnim){
    var rt = runnerAnim.t / runnerAnim.frames;
    var rx = runnerAnim.fromX + (runnerAnim.toX - runnerAnim.fromX)*rt;
    var ry = runnerAnim.fromY + (runnerAnim.toY - runnerAnim.fromY)*rt;
    stickFigure(rx, ry, 80, 4); // running pose
  }

  // batter at plate — only when batterState is "up" (running/dugout/incoming handled by runnerAnim)
  if(st.batter && st.state==="Live" && batterState==="up"){
    var bx = st.batSide==="L" ? D_HOME.x+70 : D_HOME.x-70;
    batterFigure(bx, D_HOME.y+20, 80, st.batSide);
  }

  // pitcher name below mound
  if(st.pitcher) text(lastName(st.pitcher), MOUND.x, MOUND.y+66, 26, true, "center");

  // AT BAT / status line below home plate
  var abY = D_HOME.y + 90;
  if(st.batter){
    text(st.batSide+" BAT "+lastName(st.batter)+" VS "+(st.pitcher?lastName(st.pitcher):"---"), CENTER_X, abY, 32, true, "center");
  } else {
    text("", CENTER_X, abY, 32, true, "center");
  }

  // B/S/O count band (inverted)
  var bandW = 380, bandH = 56;
  invBand(CENTER_X-bandW/2, abY+18, bandW, bandH, "B"+st.b+"  S"+st.s+"  O"+st.o, 38);

  // pitch clock (right of the count band)
  if(st.state==="Live" && clockRunning){
    text(":"+pad2(Math.max(0,pitchClock)), CENTER_X+bandW/2+110, abY+18+bandH-14, 44, true, "center");
  }
}

// ---- pitch zone + pitch log, centered below the B/S/O band (always visible) ----
// Returns the bottom y of the box.
function drawPitchZone(st, py){
  var gap = 60;
  var hdr = 30;
  var zh = 130;
  // Zone grid: left of center
  var zw = 220;
  var zx = CENTER_X - gap/2 - zw;
  invBand(zx, py, zw, hdr, "ZONE", 22);
  rect(zx, py+hdr, zw, zh, 3);
  for(var i=1;i<3;i++) line(zx+i*zw/3, py+hdr, zx+i*zw/3, py+hdr+zh, 2);
  for(var j=1;j<4;j++) line(zx, py+hdr+j*zh/4, zx+zw, py+hdr+j*zh/4, 2);
  // pitch dot (fallback: center placeholder if pitches thrown but no coords)
  var lp = st.lastPitch;
  if(!lp && st.pitches && st.pitches.length > 0){
    lp = {px:0, pz:2.5, szTop:3.5, szBot:1.5};
  }
  if(lp){
    var p = lp;
    var nx = (-p.px/0.83+1)/2; // catcher's view: flip x
    var nz = (p.pz - p.szBot)/((p.szTop-p.szBot)||1);
    nx = Math.max(0, Math.min(1, nx));
    nz = Math.max(0, Math.min(1, nz));
    var dx = zx + nx*zw;
    var dy = py+hdr + (1-nz)*zh;
    ctx.fillStyle="#000";
    ctx.beginPath(); ctx.arc(dx,dy,10,0,Math.PI*2); ctx.fill();
  }
  // Pitch log: right of center — show ALL pitches of the current at-bat
  var lx = CENTER_X + gap/2;
  var lw = 420;
  invBand(lx, py, lw, hdr, "PITCHES", 22);
  rect(lx, py+hdr, lw, zh, 2);
  var n = st.pitches.length;
  if(!n){
    text("--", lx+lw/2, py+hdr+38, 24, false, "center");
  } else {
    var lineH = Math.min(32, Math.floor((zh-14)/n));
    var fs = Math.min(24, lineH-4);
    for(var k=0;k<n;k++){
      var pt = st.pitches[k];
      var s = (k+1)+". "+pt.call.substring(0,20)+(pt.type?(" ("+pt.type.substring(0,10)+")"):"");
      text(s, lx+12, py+hdr+lineH+k*lineH, fs, false, "left");
    }
  }
  return py + hdr + zh;
}

// ---- recent plays ----
function drawRecentPlays(st, y){
  var w = 1060, x = CENTER_X - w/2;
  var hdrH = 48, rowH = 42;
  var rows = 4;
  var h = hdrH + rows*rowH + 10;
  if(y + h > BOT - 110) y = BOT - 110 - h;
  rect(x, y, w, h, 3);
  invBand(x, y, w, hdrH, "RECENT PLAYS", 32);
  for(var i=0;i<rows;i++){
    var ry = y+hdrH+34+i*rowH;
    var p = st.recent[i];
    if(!p){
      text("--", x+100, ry, 30);
      continue;
    }
    var tag = (p.top?"T":"B")+p.inn;
    var score = (p.aw!=null&&p.hm!=null) ? (p.aw+"-"+p.hm) : "";
    var desc = p.desc.length>46 ? p.desc.substring(0,44)+".." : p.desc;
    text(tag, x+16, ry, 28, true);
    text(desc, x+100, ry, 30, true);
    text(score, x+w-20, ry, 28, true, "right");
  }
}

// ================= PITCH CLOCK =================
setInterval(function(){
  if(clockRunning && pitchClock>0){ pitchClock--; render(); }
},1000);
function resetPitchClock(runnersOn){
  pitchClock = runnersOn ? 15 : 20;
  clockRunning = true;
}

// ================= POLLING =================
var currentInterval = 30000;
var prevCount = null;
function schedulePoll(ms){
  if(pollTimer) clearTimeout(pollTimer);
  currentInterval = ms;
  pollTimer = setTimeout(poll, ms);
}
function poll(){
  if(mode!=="live"){ return; }
  fetch(schedUrl()).then(function(r){ return r.json(); }).then(function(sched){
    var games = [];
    (sched.dates||[]).forEach(function(d){ games = games.concat(d.games||[]); });
    var today = dstr(new Date());
    var todays = [];
    (sched.dates||[]).forEach(function(d){ if(d.date===today) todays = d.games||[]; });
    lastGames = todays.length?todays:games;
    var g = pickGame(games);
    if(!g){ errNote = "no games found"; render(); schedulePoll(300000); return; }
    gamePk = g.gamePk;
    var state = g.status.abstractGameState;
    return fetch(feedUrl(gamePk)).then(function(r){ return r.json(); }).then(function(feed){
      lastFeed = feed;
      errNote = "";
      var st = deriveState(feed);
      var runnersOn = !!(st.bases[1]||st.bases[2]||st.bases[3]);
      var c = {b:st.b,s:st.s,o:st.o,id:st.batterId};
      if(st.state==="Live" && (!prevCount || prevCount.b!==c.b || prevCount.s!==c.s || prevCount.o!==c.o || prevCount.id!==c.id)){
        resetPitchClock(runnersOn);
        if(prevCount) animateBall(); // new pitch detected -> ball in flight
      }
      if(st.state!=="Live") clockRunning = false;
      prevCount = c;
      if(mode==="live") render();
      var ms = state==="Live" ? 30000 : (state==="Preview" ? 60000 : 300000);
      schedulePoll(ms);
    });
  }).catch(function(e){
    errNote = "fetch error - retrying";
    render();
    schedulePoll(Math.min(currentInterval||30000, 30000));
  });
}

render();
poll();
})();
